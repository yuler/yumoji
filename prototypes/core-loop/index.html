<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Yumoji 吃吃贴纸 · 核心闭环原型</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span class="island"></span><span>100%</span></div>

    <!-- 日历 -->
    <section id="calendar" class="screen active">
      <header class="cal-head">
        <p class="date" id="today-date"></p>
        <h1>Yumoji</h1>
        <p class="sub">把每一口好吃的，收成一枚贴纸</p>
      </header>

      <div class="today-card">
        <div class="today-stickers" id="today-stickers"></div>
        <div class="today-text">
          <p class="today-title" id="today-title"></p>
          <p class="today-hint" id="today-hint"></p>
        </div>
      </div>

      <div class="month">
        <div class="month-bar">
          <button class="icon-btn" id="prev-month" aria-label="上个月">‹</button>
          <b id="month-title"></b>
          <button class="icon-btn" id="next-month" aria-label="下个月">›</button>
        </div>
        <div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
        <div class="days" id="days"></div>
      </div>

      <button class="fab" id="snap-btn"><span>📷</span>拍一口</button>
    </section>

    <!-- 拍照 -->
    <section id="camera" class="screen dark">
      <header class="cam-head">
        <button class="icon-btn light" id="cam-close" aria-label="关闭">✕</button>
        <label class="debug"><input type="checkbox" id="fail-toggle" /> 模拟识别失败</label>
      </header>
      <div class="viewfinder" id="viewfinder">
        <div class="plate" id="cam-plate"></div>
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      </div>
      <p class="cam-hint" id="cam-hint"></p>
      <div class="samples" id="samples"></div>
      <footer class="cam-foot">
        <button class="album" id="album-btn" aria-label="从相册选">🖼</button>
        <button class="shutter" id="shutter-btn" aria-label="拍照"></button>
        <span class="album-spacer"></span>
      </footer>
    </section>

    <!-- 抠图与确认 -->
    <section id="cutout" class="screen">
      <header class="bar">
        <button class="link" id="cut-back">‹ 重拍</button>
      </header>
      <div class="stage photo-stage" id="cut-stage">
        <div class="plate big" id="cut-plate"></div>
        <div class="scan" id="scan"></div>
      </div>
      <div class="cut-info">
        <p class="cut-title" id="cut-title">正在抠图…</p>
        <p class="sub" id="cut-sub">把食物从照片里抠出来</p>
      </div>
      <footer class="foot">
        <button class="btn primary" id="cut-confirm" disabled>就这块</button>
      </footer>
    </section>

    <!-- 结果 -->
    <section id="result" class="screen">
      <header class="bar">
        <button class="link" id="res-back">‹ 再来一张</button>
      </header>
      <div class="stage" id="res-stage"></div>
      <div class="card analysis" id="analysis"></div>
      <footer class="foot">
        <button class="btn primary" id="save-btn">收进今天</button>
      </footer>
    </section>

    <!-- 当日贴纸 -->
    <div class="sheet-mask" id="day-sheet" hidden>
      <div class="sheet">
        <div class="grabber"></div>
        <h2 class="sheet-title" id="day-title"></h2>
        <p class="sub" id="day-sub"></p>
        <ul class="entries" id="entries"></ul>
        <p class="empty" id="day-empty" hidden>这天还没有贴纸</p>
      </div>
    </div>

    <!-- 改热量 -->
    <div class="alert-mask" id="kcal-alert" hidden>
      <div class="alert">
        <p class="alert-title">改一下热量</p>
        <p class="alert-body">AI 只是粗估，按你知道的来</p>
        <div class="kcal-input"><input id="kcal-input" type="number" inputmode="numeric" min="0" max="5000" /><span>千卡</span></div>
        <div class="alert-btns">
          <button id="kcal-cancel">取消</button>
          <button id="kcal-ok" class="strong">好</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
