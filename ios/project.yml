name: Yumoji
options:
  bundleIdPrefix: cc.yuler
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
targets:
  Yumoji:
    type: application
    platform: iOS
    sources:
      - path: Yumoji
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: cc.yuler.yumoji
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_FILE: Yumoji/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      MARKETING_VERSION: "${APP_VERSION}"
      CURRENT_PROJECT_VERSION: "${APP_BUILD}"
      TARGETED_DEVICE_FAMILY: "1"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  YumojiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YumojiTests
    dependencies:
      - target: Yumoji
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: cc.yuler.yumoji.tests
      GENERATE_INFOPLIST_FILE: YES
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
schemes:
  Yumoji:
    build:
      targets:
        Yumoji: all
    test:
      targets:
        - YumojiTests
