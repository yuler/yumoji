name: iOS TestFlight

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version without leading v (e.g. 0.1.0)'
        required: true
        type: string
      ref:
        description: 'Git commit SHA or ref to build'
        required: true
        type: string
      distribute_external:
        description: 'Wait for processing and add build to External TestFlight group'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override (e.g. 0.1.0)'
        required: false
        type: string
        default: ''
      distribute_external:
        description: 'Wait for processing and add build to External TestFlight group'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-tags: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check secrets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          for name in \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_BASE64 \
            IOS_DEVELOPMENT_TEAM \
            IOS_DISTRIBUTION_CERT_P12_BASE64 \
            IOS_DISTRIBUTION_CERT_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: ${name}"
              exit 1
            fi
          done

      - name: Determine version and build number
        id: version
        shell: bash
        env:
          YUMOJI_VERSION: ${{ inputs.version || '' }}
        run: |
          source ./scripts/lib.sh
          load_app_version
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$APP_BUILD" >> "$GITHUB_OUTPUT"
          echo "Building Yumoji iOS version: $APP_VERSION (build $APP_BUILD)"

      - name: Import signing certificate
        env:
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$IOS_DISTRIBUTION_CERT_P12_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/distribution.p12"
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN_PATH" -P "$IOS_DISTRIBUTION_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Prepare App Store Connect API key and asc CLI
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

          curl -fsSL https://asccli.sh/install | INSTALL_DIR="$HOME/.local/bin" bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          "$HOME/.local/bin/asc" auth login --bypass-keychain \
            --name "Yumoji CI" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key "$RUNNER_TEMP/AuthKey.p8"

      - name: Fetch and install App Store provisioning profile
        id: signing
        shell: bash
        env:
          BUNDLE_ID: cc.yuler.yumoji
        run: |
          set -euo pipefail
          SIGNING_DIR="$RUNNER_TEMP/signing"
          mkdir -p "$SIGNING_DIR"

          asc signing fetch \
            --bundle-id "$BUNDLE_ID" \
            --profile-type IOS_APP_STORE \
            --delete-stale-profiles \
            --confirm \
            --create-missing \
            --output "$SIGNING_DIR"

          PROFILE_PATH="$(find "$SIGNING_DIR" -type f -name '*.mobileprovision' | head -n 1)"
          if [ -z "$PROFILE_PATH" ] || [ ! -f "$PROFILE_PATH" ]; then
            echo "::error::Failed to fetch IOS_APP_STORE provisioning profile for $BUNDLE_ID"
            exit 1
          fi

          asc profiles local install --path "$PROFILE_PATH" --force

          PROFILE_INFO="$(asc profiles inspect --path "$PROFILE_PATH" --output json)"
          PROFILE_UUID="$(printf '%s' "$PROFILE_INFO" | python3 -c 'import json,sys; print(json.load(sys.stdin)["uuid"])')"
          PROFILE_NAME="$(printf '%s' "$PROFILE_INFO" | python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])')"
          PROFILE_CERT_SHA1S="$(printf '%s' "$PROFILE_INFO" | python3 -c 'import json,sys; print("\n".join(c["sha1"].upper() for c in json.load(sys.stdin).get("certificates", []) if c.get("sha1")))')"

          KEYCHAIN_IDENTITIES="$(security find-identity -v -p codesigning "$RUNNER_TEMP/app-signing.keychain-db")"
          MATCHED_SHA1=""
          while IFS= read -r sha1; do
            [ -z "$sha1" ] && continue
            if printf '%s\n' "$KEYCHAIN_IDENTITIES" | grep -qi "$sha1"; then
              MATCHED_SHA1="$sha1"
              break
            fi
          done <<< "$PROFILE_CERT_SHA1S"

          if [ -z "$MATCHED_SHA1" ]; then
            echo "::error::Provisioning profile '$PROFILE_NAME' ($PROFILE_UUID) does not match the Distribution certificate in IOS_DISTRIBUTION_CERT_P12_BASE64."
            echo "Keychain identities:"
            echo "$KEYCHAIN_IDENTITIES"
            exit 1
          fi

          echo "Installed App Store profile: $PROFILE_NAME ($PROFILE_UUID), matched cert SHA-1: $MATCHED_SHA1"
          {
            echo "bundle_id=$BUNDLE_ID"
            echo "profile_uuid=$PROFILE_UUID"
            echo "profile_name=$PROFILE_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare signing config and ExportOptions
        shell: bash
        env:
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          BUNDLE_ID: ${{ steps.signing.outputs.bundle_id }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          set -euo pipefail
          cat > ios/Signing.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = ${IOS_DEVELOPMENT_TEAM}
          CODE_SIGN_IDENTITY = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_UUID}
          EOF

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${IOS_DEVELOPMENT_TEAM}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Generate Xcode project
        env:
          YUMOJI_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/ios-xcodegen.sh

      - name: Archive and upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          xcodebuild \
            -project ios/Yumoji.xcodeproj \
            -scheme Yumoji \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Yumoji.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Yumoji.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Distribute to TestFlight External group
        shell: bash
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          EXTERNAL_GROUP: ${{ vars.TESTFLIGHT_EXTERNAL_GROUP || 'External' }}
          DISTRIBUTE_EXTERNAL: ${{ inputs.distribute_external }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail

          if [ "$DISTRIBUTE_EXTERNAL" = "false" ]; then
            echo "::notice::External TestFlight distribution disabled via input; build $APP_VERSION ($APP_BUILD) was uploaded."
            exit 0
          fi

          if [ -z "$ASC_APP_ID" ]; then
            echo "::notice::Repository variable ASC_APP_ID is not configured; skipping automatic External group assignment. Set ASC_APP_ID to enable."
            exit 0
          fi

          echo "Waiting for Yumoji $APP_VERSION ($APP_BUILD) to finish processing..."
          asc builds wait \
            --app "$ASC_APP_ID" \
            --build-number "$APP_BUILD" \
            --platform IOS \
            --version "$APP_VERSION" \
            --timeout 45m \
            --poll-interval 30s

          BUILD_ID="$(asc builds info \
            --app "$ASC_APP_ID" \
            --build-number "$APP_BUILD" \
            --platform IOS \
            --version "$APP_VERSION" \
            --output json | python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; print((d[0] if isinstance(d, list) else d)["id"])')"
          STATE="$(asc testflight distribution view \
            --build-id "$BUILD_ID" \
            --output json | python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; print((d[0] if isinstance(d, list) else d)["attributes"]["externalBuildState"])')"
          echo "Build $BUILD_ID external state: $STATE"

          case "$STATE" in
            READY_FOR_BETA_SUBMISSION)
              asc builds add-groups \
                --build-id "$BUILD_ID" \
                --group "$EXTERNAL_GROUP" \
                --submit \
                --confirm
              ;;
            WAITING_FOR_BETA_REVIEW|IN_BETA_REVIEW|IN_BETA_TESTING|BETA_APPROVED)
              asc builds add-groups \
                --build-id "$BUILD_ID" \
                --group "$EXTERNAL_GROUP"
              ;;
            *)
              echo "::error::Build $BUILD_ID is not ready for external testing (state: $STATE)"
              exit 1
              ;;
          esac
